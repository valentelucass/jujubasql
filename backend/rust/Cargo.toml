[package]
name = "jujubasql"
version = "0.1.11"
description = "Explorador local de SQL Server"
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["net", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
tiberius = { version = "0.12.3", default-features = false, features = ["tds73", "native-tls", "winauth", "chrono"] }
zeroize = "1"
futures-util = "0.3"
odbc-api = { version = "30.1", default-features = false, features = ["odbc_version_3_80"] }
sqlparser = { version = "0.63", default-features = false, features = ["std", "visitor"] }
tauri-plugin-opener = "2"

[profile.release]
strip = true
